name: Lint after commit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-checks:
    name: 'GDScript Check'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Scony/godot-gdscript-toolkit@master
    # Addons are probably fine
    - run: rm -rf addons
    - run: gdlint .
