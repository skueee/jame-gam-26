name: Format when needed

on: 'workflow_dispatch'

permissions:
  contents: write

jobs:
  static-checks:
    name: 'GDScript Format'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
    # Addons are probably fine ig
    - run: rm -rf addons
    - uses: Scony/godot-gdscript-toolkit@master
    - run: gdformat .

    # gdformat makes a requirements file, we don't want that
    - run: rm -f requirements.txt

    # Restore addons so that they are not deleted
    - run: git checkout addons

    - uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "style: format"
